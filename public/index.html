<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a1428">
<title>WORLD QUIZ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    background: radial-gradient(ellipse at center, #1a2848 0%, #0a1428 70%, #050a18 100%);
    color: #fff;
    overflow-x: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .app { min-height: 100dvh; display: flex; flex-direction: column; padding: 16px; max-width: 720px; margin: 0 auto; width: 100%; }

  .screen { display: none; flex: 1; flex-direction: column; }
  .screen.active { display: flex; }

  /* Title */
  .title { text-align: center; padding: 28px 16px 22px; }
  .title h1 {
    font-family: 'Inter', 'Helvetica Neue', system-ui, sans-serif;
    font-size: clamp(36px, 11vw, 56px);
    margin: 0; letter-spacing: -0.04em; font-weight: 900;
    background: linear-gradient(180deg, #6ec1ff 0%, #2980c9 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .title .subtitle { font-size: 11px; letter-spacing: 6px; color: rgba(255,255,255,0.55); margin-top: 4px; }

  .panel {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(110,193,255,0.2);
    border-radius: 16px;
    padding: 18px; margin-bottom: 12px;
    backdrop-filter: blur(8px);
  }
  .panel h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: 3px; color: #6ec1ff; font-weight: 600; }
  .panel input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 12px 14px;
    color: #fff; font-size: 16px; outline: none;
  }
  .panel input:focus { border-color: #6ec1ff; background: rgba(255,255,255,0.12); }
  .panel input + input { margin-top: 8px; }

  .btn {
    width: 100%;
    border: none; border-radius: 14px;
    padding: 16px;
    font-size: 16px; font-weight: 700; letter-spacing: 4px;
    cursor: pointer; transition: transform .1s;
  }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(180deg, #6ec1ff 0%, #2980c9 100%);
    color: #001428;
    box-shadow: 0 6px 18px rgba(41,128,201,0.45);
  }
  .btn-ghost {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    letter-spacing: 2px;
  }
  .btn + .btn { margin-top: 10px; }

  /* Lobby */
  .room-info {
    text-align: center; margin: 12px 0 18px;
    font-size: 11px; letter-spacing: 4px; color: rgba(255,255,255,0.55);
  }
  .room-code {
    display: inline-block; margin-top: 4px;
    font-family: 'Inter', system-ui, monospace;
    font-size: 30px; font-weight: 900; letter-spacing: 6px;
    color: #6ec1ff;
  }
  .player-list { display: flex; flex-direction: column; gap: 8px; }
  .player-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
  }
  .player-row.you { background: rgba(110,193,255,0.12); border-color: rgba(110,193,255,0.4); }
  .player-row.guessed { background: rgba(80,255,150,0.1); border-color: rgba(80,255,150,0.3); }
  .player-row .name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .color-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255,255,255,0.4); flex-shrink: 0; }
  .player-row .badge {
    font-size: 10px; padding: 3px 8px; border-radius: 999px;
    background: rgba(255,255,255,0.12); letter-spacing: 1px;
  }
  .player-row.host .badge { background: rgba(110,193,255,0.3); color: #6ec1ff; }
  .status-line { text-align: center; margin: 8px 0 12px; font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.55); }

  /* Loading */
  .loading-screen { align-items: center; justify-content: center; text-align: center; }
  .loading-spinner {
    width: 60px; height: 60px;
    border: 4px solid rgba(110,193,255,0.2);
    border-top-color: #6ec1ff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,0.6); }

  /* View */
  .images-header {
    text-align: center; padding: 4px 0 12px;
    font-size: 12px; letter-spacing: 4px; color: rgba(255,255,255,0.6);
  }
  .images-header .round-num { color: #6ec1ff; font-weight: 700; }
  .images-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    flex: 1; overflow-y: auto;
    margin-bottom: 12px;
    align-content: start;
  }
  .images-grid .img-tile {
    aspect-ratio: 4 / 3;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    overflow: hidden;
    cursor: zoom-in;
    position: relative;
  }
  .images-grid .img-tile img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .images-grid .img-tile .num {
    position: absolute;
    top: 6px; left: 6px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(0,0,0,0.65);
    color: #6ec1ff;
    font-size: 12px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.94);
    opacity: 0; pointer-events: none; transition: opacity .2s;
    padding: 16px;
  }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

  /* Guess */
  .guess-header {
    text-align: center; padding: 6px 0 8px;
  }
  .guess-header .timer {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 28px; font-weight: 900; color: #6ec1ff;
    letter-spacing: 2px;
  }
  .guess-header .progress-text {
    font-size: 11px; letter-spacing: 3px; color: rgba(255,255,255,0.55);
    margin-top: 2px;
  }
  .guess-instruction {
    text-align: center; padding: 0 0 8px;
    font-size: 12px; color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
  }
  .guess-locked-banner {
    text-align: center;
    padding: 10px;
    background: rgba(80,255,150,0.15);
    border: 1px solid rgba(80,255,150,0.4);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px; letter-spacing: 2px;
    color: #80ffaa; font-weight: 700;
  }

  /* Maps */
  #mapEl, #revealMapEl {
    width: 100%;
    height: 50dvh;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid rgba(110,193,255,0.2);
    overflow: hidden;
  }
  .leaflet-container { background: #0a1428 !important; }
  .leaflet-control-attribution { font-size: 9px !important; }

  .player-marker {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .answer-marker {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: #ffd76e;
    border: 3px solid #fff;
    box-shadow: 0 0 18px rgba(255,215,110,0.8);
    animation: answerPulse 1.6s ease-in-out infinite;
  }
  @keyframes answerPulse {
    0%, 100% { box-shadow: 0 0 14px rgba(255,215,110,0.5); }
    50%      { box-shadow: 0 0 28px rgba(255,215,110,0.9); }
  }

  /* Reveal */
  .answer-banner {
    text-align: center;
    padding: 14px;
    background: linear-gradient(90deg, transparent, rgba(110,193,255,0.18), transparent);
    border-top: 1px solid rgba(110,193,255,0.3);
    border-bottom: 1px solid rgba(110,193,255,0.3);
    margin: 0 -16px 12px;
  }
  .answer-banner .label { font-size: 10px; letter-spacing: 4px; color: rgba(255,255,255,0.6); }
  .answer-banner .city-name { font-size: 24px; font-weight: 900; color: #ffd76e; margin-top: 2px; letter-spacing: 2px; }

  .drink-banner {
    text-align: center;
    padding: 16px 14px 18px;
    background: linear-gradient(90deg, transparent, rgba(255,40,60,0.22), transparent);
    border-top: 1px solid rgba(255,40,60,0.5);
    border-bottom: 1px solid rgba(255,40,60,0.5);
    margin: 0 -16px 14px;
    animation: drinkBannerPulse 1.6s ease-in-out infinite;
  }
  @keyframes drinkBannerPulse {
    0%, 100% { background: linear-gradient(90deg, transparent, rgba(255,40,60,0.18), transparent); }
    50%      { background: linear-gradient(90deg, transparent, rgba(255,40,60,0.35), transparent); }
  }
  .drink-banner .label {
    font-size: 11px; letter-spacing: 5px;
    color: rgba(255,255,255,0.85);
    font-weight: 700;
  }
  .drink-banner .drinker-list {
    font-size: 24px; font-weight: 900;
    color: #ff5e6e;
    margin-top: 6px; letter-spacing: 2px;
    text-shadow: 0 0 16px rgba(255,40,60,0.7);
    line-height: 1.3;
    word-break: keep-all;
  }
  .drink-banner .drinker-list .cup {
    font-size: 14px; font-weight: 700;
    color: #fff;
    margin-left: 4px;
    letter-spacing: 1px;
  }
  .drink-banner.empty { display: none; }

  .reveal-list {
    display: flex; flex-direction: column;
    gap: 6px; margin-bottom: 12px;
  }
  .reveal-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    font-size: 14px;
  }
  .reveal-row.loser {
    background: linear-gradient(180deg, rgba(255,40,60,0.28) 0%, rgba(255,40,60,0.08) 100%);
    border-color: #ff5e6e;
    box-shadow: 0 0 16px rgba(255,40,60,0.3);
  }
  .reveal-row.winner {
    background: rgba(255,215,110,0.16);
    border-color: rgba(255,215,110,0.5);
  }
  .reveal-row .name { font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .reveal-row .distance { font-family: 'Inter', system-ui, monospace; opacity: 0.85; font-size: 13px; }
  .reveal-row.loser .distance {
    color: #fff; font-weight: 900;
    background: linear-gradient(180deg, #ff5e6e 0%, #c41020 100%);
    padding: 4px 10px; border-radius: 8px;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(255,80,80,0.95); color: #fff;
    padding: 12px 20px; border-radius: 10px;
    font-size: 14px; z-index: 1000;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .toast.show { opacity: 1; }

  .footer-actions { margin-top: auto; }

  .version-tag {
    position: fixed;
    bottom: 6px; right: 8px;
    font-family: 'Inter', system-ui, monospace;
    font-size: 10px; letter-spacing: 1px;
    color: rgba(255,255,255,0.35);
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ENTER -->
  <div class="screen active" id="enterScreen">
    <div class="title">
      <h1>WORLD QUIZ</h1>
      <div class="subtitle">8 PHOTOS · GUESS THE CITY</div>
    </div>
    <div class="panel">
      <h2>あなたの名前</h2>
      <input id="nameInput" type="text" placeholder="プレイヤー名" maxlength="12" autocomplete="off">
    </div>
    <div class="panel">
      <h2>ルームコード</h2>
      <input id="roomInput" type="text" placeholder="既存ルームのコード（空なら新規作成）" maxlength="6" autocomplete="off" value="KK2022" style="text-transform:uppercase;letter-spacing:2px;">
    </div>
    <button class="btn btn-primary" id="enterBtn">JOIN</button>
  </div>

  <!-- LOBBY -->
  <div class="screen" id="lobbyScreen">
    <div class="room-info">
      ROOM CODE
      <div class="room-code" id="roomCodeDisplay">------</div>
    </div>
    <div class="panel">
      <h2>プレイヤー <span id="playerCountLabel" style="opacity:.7"></span></h2>
      <div class="player-list" id="lobbyPlayerList"></div>
    </div>
    <div class="status-line" id="lobbyStatus"></div>
    <div class="footer-actions">
      <button class="btn btn-primary" id="startBtn" style="display:none">START</button>
      <button class="btn btn-ghost" id="leaveBtn">退出</button>
    </div>
  </div>

  <!-- LOADING -->
  <div class="screen loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <div class="loading-text">画像を集めています…</div>
  </div>

  <!-- VIEW -->
  <div class="screen" id="viewScreen">
    <div class="images-header">
      ROUND <span class="round-num" id="roundNum">1</span> · どこの都市？
    </div>
    <div class="images-grid" id="imagesGrid"></div>
    <div class="footer-actions">
      <button class="btn btn-primary" id="toGuessBtn" style="display:none">推測スタート</button>
      <div class="status-line" id="viewStatus"></div>
    </div>
  </div>

  <!-- GUESS -->
  <div class="screen" id="guessScreen">
    <div class="guess-header">
      <div class="timer" id="guessTimer">60</div>
      <div class="progress-text" id="guessProgress">0 / 0 人が回答済み</div>
    </div>
    <div class="guess-instruction" id="guessInstruction">マップをタップしてピンを置く</div>
    <div class="guess-locked-banner" id="guessLockedBanner" style="display:none">
      ✓ 回答ロック済み — 他の人を待ちます
    </div>
    <div id="mapEl"></div>
    <div class="footer-actions">
      <button class="btn btn-primary" id="confirmGuessBtn" disabled>確定</button>
    </div>
  </div>

  <!-- REVEAL -->
  <div class="screen" id="revealScreen">
    <div class="answer-banner">
      <div class="label">ANSWER</div>
      <div class="city-name" id="answerCityName">-</div>
    </div>
    <div class="drink-banner" id="drinkBanner">
      <div class="label">🍺 DRINK 🍺</div>
      <div class="drinker-list" id="drinkerList">-</div>
    </div>
    <div id="revealMapEl"></div>
    <div class="reveal-list" id="revealList"></div>
    <div class="footer-actions">
      <button class="btn btn-primary" id="nextRoundBtn" style="display:none">NEXT ROUND</button>
      <button class="btn btn-ghost" id="endRoundBtn" style="display:none">ロビーに戻る</button>
      <div class="status-line" id="revealStatus"></div>
    </div>
  </div>

</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>
<div class="toast" id="toast"></div>
<div class="version-tag" id="versionTag"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const APP_VERSION = "v0.2.1";
document.getElementById("versionTag").textContent = APP_VERSION;

const PHASES = {
  LOBBY: "lobby", LOADING: "loading", VIEW: "view", GUESS: "guess", REVEAL: "reveal",
};
const STORAGE_KEY = "world_quiz_v1";
const MAX_RECONNECT = 8;
let ws = null;
let serverState = null;
let myInfo = { name: "", room: "" };
let timerInterval = null;
let manualClose = false;
let reconnectTimer = null;
let reconnectAttempts = 0;
let pendingGuess = null;
let heartbeatTimer = null;
let lastServerMessageAt = 0;
const HEARTBEAT_INTERVAL_MS = 5_000;
const HEARTBEAT_TIMEOUT_MS = 20_000;

let guessMap = null;
let guessMarker = null;
let revealMap = null;
let lastRenderedRound = -1;
let lastRevealKey = "";
let myConfirmedGuess = null;

let wakeLock = null;
async function requestWakeLock() {
  if (!("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (!wakeLock && ws) requestWakeLock();
  if (myInfo.room && myInfo.name && !manualClose) {
    if (!ws || ws.readyState === WebSocket.CLOSING || ws.readyState === WebSocket.CLOSED) {
      forceReconnect("resume");
    }
  }
});

function forceReconnect(reason) {
  if (manualClose) return;
  if (reconnectTimer) return;
  if (ws) {
    const old = ws;
    ws = null;
    try { old.close(4001, reason || "forced"); } catch {}
  }
  reconnectTimer = setTimeout(() => {
    reconnectTimer = null;
    connect(myInfo.name, myInfo.room);
  }, 200);
}

function getOrCreateClientId() {
  const KEY = "world_quiz_clientId_v1";
  let id = "";
  try { id = localStorage.getItem(KEY) || ""; } catch {}
  if (!/^[A-Za-z0-9-]{8,64}$/.test(id)) {
    id = (crypto && crypto.randomUUID) ? crypto.randomUUID()
      : Array.from({length: 32}, () => "0123456789abcdef"[Math.floor(Math.random()*16)]).join("");
    try { localStorage.setItem(KEY, id); } catch {}
  }
  return id;
}
const CLIENT_ID = getOrCreateClientId();

const FUNNY_NAMES = [
  "酒豪", "ザル", "ベロベロ", "ほろ酔い", "下戸", "二日酔い", "顔面紅葉", "記憶喪失",
  "翌日後悔", "終電マン", "ウーロン茶", "一気のヌシ", "顔面真っ赤", "介錯人", "ノンアル王", "酔拳",
];
function randomFunnyName() {
  return FUNNY_NAMES[Math.floor(Math.random() * FUNNY_NAMES.length)];
}
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
  document.getElementById("nameInput").value = saved.name || randomFunnyName();
} catch {
  document.getElementById("nameInput").value = randomFunnyName();
}

function $(id) { return document.getElementById(id); }
function showScreen(name) {
  document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
  $(name + "Screen").classList.add("active");
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function showToast(msg, ms = 2500) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), ms);
}

// ===== Connection =====
function connect(name, room) {
  myInfo.name = name; myInfo.room = room;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ name })); } catch {}
  manualClose = false;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = `${proto}://${location.host}/ws`
    + `?room=${encodeURIComponent(room)}`
    + `&name=${encodeURIComponent(name)}`
    + `&clientId=${encodeURIComponent(CLIENT_ID)}`;

  const sock = new WebSocket(url);
  ws = sock;

  sock.addEventListener("open", () => {
    if (ws !== sock) return;
    reconnectAttempts = 0;
    lastServerMessageAt = Date.now();
    startHeartbeat();
    requestWakeLock();
    $("roomCodeDisplay").textContent = room;
    if (pendingGuess) {
      const g = pendingGuess;
      pendingGuess = null;
      try { sock.send(JSON.stringify({ type: "guess", lat: g.lat, lng: g.lng })); } catch {}
    }
    try { sock.send(JSON.stringify({ type: "hello" })); } catch {}
  });

  sock.addEventListener("message", (e) => {
    if (ws !== sock) return;
    lastServerMessageAt = Date.now();
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    if (msg.type === "state") {
      serverState = msg.state;
      onStateUpdate();
    }
  });

  sock.addEventListener("close", (e) => {
    const isCurrent = ws === sock;
    if (isCurrent) {
      cleanupTimers();
      stopHeartbeat();
      ws = null;
    }
    if (e.code === 4002) {
      if (isCurrent) {
        manualClose = true; reconnectAttempts = 0; pendingGuess = null;
        showToast("別のタブで開かれました");
        showScreen("enter");
      }
      return;
    }
    if (e.code === 4030 || e.code === 4023 || e.code === 1008 || e.code === 1003) {
      if (isCurrent) {
        manualClose = true; reconnectAttempts = 0; pendingGuess = null;
        showToast(e.code === 4030 ? "ルームが満員です"
          : e.code === 4023 ? "対局中のため新規参加できません"
          : "ルームに入れませんでした");
        showScreen("enter");
      }
      return;
    }
    if (manualClose) {
      if (isCurrent) {
        reconnectAttempts = 0; pendingGuess = null;
        showScreen("enter");
      }
      return;
    }
    if (isCurrent && myInfo.room && myInfo.name && reconnectAttempts < MAX_RECONNECT) {
      reconnectAttempts++;
      const backoff = Math.min(4000, 500 * Math.pow(1.6, reconnectAttempts - 1));
      showToast(`再接続中… (${reconnectAttempts}/${MAX_RECONNECT})`, backoff + 400);
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        reconnectTimer = null;
        connect(myInfo.name, myInfo.room);
      }, backoff);
      return;
    }
    if (isCurrent) {
      showToast("再接続できませんでした"); pendingGuess = null;
      showScreen("enter"); reconnectAttempts = 0;
    }
  });

  sock.addEventListener("error", () => {});
}

function send(msg) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
    return true;
  }
  return false;
}

function startHeartbeat() {
  stopHeartbeat();
  heartbeatTimer = setInterval(() => {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    try { ws.send(JSON.stringify({ type: "ping" })); } catch {}
    if (Date.now() - lastServerMessageAt > HEARTBEAT_TIMEOUT_MS) {
      forceReconnect("heartbeat-timeout");
    }
  }, HEARTBEAT_INTERVAL_MS);
}
function stopHeartbeat() {
  if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
}

function disconnect() {
  manualClose = true;
  reconnectAttempts = 0;
  pendingGuess = null;
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  stopHeartbeat();
  if (ws) { try { ws.close(1000, "user left"); } catch {} ws = null; }
  if (wakeLock) { try { wakeLock.release(); } catch {} wakeLock = null; }
  cleanupTimers();
  showScreen("enter");
}

// ===== State handling =====
function onStateUpdate() {
  if (!serverState) return;
  const phase = serverState.phase;

  // New round → reset round-local state
  if (serverState.roundNum !== lastRenderedRound) {
    myConfirmedGuess = null;
    lastRevealKey = "";
    if (guessMap) { guessMap.remove(); guessMap = null; guessMarker = null; }
    if (revealMap) { revealMap.remove(); revealMap = null; }
    lastRenderedRound = serverState.roundNum;
  }

  switch (phase) {
    case PHASES.LOBBY: renderLobby(); break;
    case PHASES.LOADING: renderLoading(); break;
    case PHASES.VIEW: renderView(); break;
    case PHASES.GUESS: renderGuess(); break;
    case PHASES.REVEAL: renderReveal(); break;
  }
}

// ===== Lobby =====
function renderLobby() {
  showScreen("lobby");
  cleanupTimers();
  const players = serverState.players || [];
  $("playerCountLabel").textContent = `(${players.length}/12)`;
  $("lobbyPlayerList").innerHTML = players.map(p => `
    <div class="player-row ${p.isYou ? "you" : ""} ${p.id === serverState.hostId ? "host" : ""}">
      <span class="name">
        <span class="color-dot" style="background:${p.color}"></span>
        ${escapeHtml(p.name)}${p.isYou ? " (あなた)" : ""}
      </span>
      <span class="badge">${p.id === serverState.hostId ? "HOST" : ""}${p.drinkCount > 0 ? " · " + p.drinkCount + "杯" : ""}</span>
    </div>
  `).join("");

  const isHost = serverState.you === serverState.hostId;
  const startBtn = $("startBtn");
  const status = $("lobbyStatus");
  if (isHost) {
    startBtn.style.display = "";
    if (players.length < 2) {
      startBtn.disabled = true;
      status.textContent = "もう1人以上の参加を待っています";
    } else {
      startBtn.disabled = false;
      status.textContent = "全員揃ったらSTART";
    }
  } else {
    startBtn.style.display = "none";
    status.textContent = "ホストの開始を待っています";
  }
}

// ===== Loading =====
function renderLoading() {
  showScreen("loading");
  cleanupTimers();
}

// ===== View =====
function renderView() {
  showScreen("view");
  cleanupTimers();
  $("roundNum").textContent = serverState.roundNum;

  const images = serverState.images || [];
  const imagesKey = images.join("|");
  if ($("imagesGrid").dataset.key !== imagesKey) {
    $("imagesGrid").dataset.key = imagesKey;
    $("imagesGrid").innerHTML = images.map((src, i) => `
      <div class="img-tile" data-src="${escapeHtml(src)}">
        <span class="num">${i + 1}</span>
        <img src="${escapeHtml(src)}" alt="image ${i + 1}" loading="lazy">
      </div>
    `).join("");
    document.querySelectorAll("#imagesGrid .img-tile").forEach(t => {
      t.addEventListener("click", () => {
        $("lightboxImg").src = t.dataset.src;
        $("lightbox").classList.add("show");
      });
    });
  }

  const isHost = serverState.you === serverState.hostId;
  $("toGuessBtn").style.display = isHost ? "" : "none";
  $("viewStatus").textContent = isHost ? "じっくり見て、推測スタートでマップへ" : "ホストが推測スタートを押すのを待っています";
}

// ===== Guess =====
function renderGuess() {
  showScreen("guess");
  if (!guessMap) initGuessMap();

  const me = (serverState.players || []).find(p => p.isYou);
  const locked = !!(me && me.hasGuessed);
  $("guessLockedBanner").style.display = locked ? "" : "none";
  $("guessInstruction").style.display = locked ? "none" : "";
  $("confirmGuessBtn").style.display = locked ? "none" : "";

  if (locked && myConfirmedGuess && !guessMarker) {
    placeGuessPin(myConfirmedGuess.lat, myConfirmedGuess.lng);
  }

  const guessed = (serverState.players || []).filter(p => p.hasGuessed).length;
  const total = (serverState.players || []).length;
  $("guessProgress").textContent = `${guessed} / ${total} 人が回答済み`;

  cleanupTimers();
  const update = () => {
    const remain = Math.max(0, Math.ceil((serverState.phaseEndAt - Date.now()) / 1000));
    $("guessTimer").textContent = remain;
    if (remain <= 0) cleanupTimers();
  };
  update();
  timerInterval = setInterval(update, 250);
}

function initGuessMap() {
  if (guessMap) { guessMap.remove(); guessMap = null; }
  guessMarker = null;
  guessMap = L.map("mapEl", {
    worldCopyJump: true,
    zoomControl: true,
  }).setView([20, 0], 1);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    minZoom: 1, maxZoom: 8,
    attribution: "© OpenStreetMap",
  }).addTo(guessMap);
  guessMap.on("click", (e) => {
    const me = (serverState.players || []).find(p => p.isYou);
    if (me && me.hasGuessed) return;
    placeGuessPin(e.latlng.lat, e.latlng.lng);
  });
  setTimeout(() => guessMap && guessMap.invalidateSize(), 80);
}

function myColor() {
  const me = (serverState.players || []).find(p => p.isYou);
  return (me && me.color) || "#6ec1ff";
}

function placeGuessPin(lat, lng) {
  if (!guessMap) return;
  if (guessMarker) guessMap.removeLayer(guessMarker);
  guessMarker = L.marker([lat, lng], {
    icon: L.divIcon({
      className: "",
      html: `<div class="player-marker" style="background:${myColor()}"></div>`,
      iconSize: [22, 22], iconAnchor: [11, 11],
    }),
  }).addTo(guessMap);
  $("confirmGuessBtn").disabled = false;
}

$("confirmGuessBtn").addEventListener("click", () => {
  if (!guessMarker) return;
  const ll = guessMarker.getLatLng();
  myConfirmedGuess = { lat: ll.lat, lng: ll.lng };
  // Optimistic lock so a slow network can't let the user double-confirm
  $("confirmGuessBtn").style.display = "none";
  $("guessLockedBanner").style.display = "";
  $("guessInstruction").style.display = "none";
  if (!send({ type: "guess", lat: ll.lat, lng: ll.lng })) {
    pendingGuess = { lat: ll.lat, lng: ll.lng };
    showToast("再接続後に送信します");
  }
});

// ===== Reveal =====
function renderReveal() {
  showScreen("reveal");
  cleanupTimers();
  const result = serverState.result;
  if (!result) return;

  $("answerCityName").textContent = result.city.jp;

  const players = serverState.players || [];
  const playerById = new Map(players.map(p => [p.id, p]));
  const sorted = [...result.guesses].sort((a, b) => a.distanceKm - b.distanceKm);
  const losers = new Set(result.losers || []);

  // Big "DRINK" banner — list every player who has to drink this round
  const drinkBanner = $("drinkBanner");
  const drinkerNames = (result.losers || [])
    .map(id => playerById.get(id))
    .filter(Boolean)
    .map(p => `${escapeHtml(p.name)}<span class="cup">1杯</span>`);
  if (drinkerNames.length === 0) {
    drinkBanner.classList.add("empty");
    $("drinkerList").innerHTML = "";
  } else {
    drinkBanner.classList.remove("empty");
    $("drinkerList").innerHTML = drinkerNames.join(" / ");
  }

  const rows = [];
  sorted.forEach((g, i) => {
    const p = playerById.get(g.id);
    if (!p) return;
    const isLoser = losers.has(g.id);
    const isWinner = i === 0 && !isLoser;
    rows.push({
      cls: "reveal-row" + (isLoser ? " loser" : isWinner ? " winner" : ""),
      color: p.color, name: p.name + (isLoser ? " 🍺" : isWinner ? " 🏆" : ""),
      isYou: p.isYou,
      right: formatDistance(g.distanceKm),
    });
  });
  (result.noGuesses || []).forEach(id => {
    const p = playerById.get(id);
    if (!p) return;
    rows.push({
      cls: "reveal-row loser",
      color: p.color, name: p.name + " 🍺",
      isYou: p.isYou,
      right: "未回答",
    });
  });

  $("revealList").innerHTML = rows.map(r => `
    <div class="${r.cls}">
      <span class="name">
        <span class="color-dot" style="background:${r.color}"></span>
        ${escapeHtml(r.name)}${r.isYou ? "（あなた）" : ""}
      </span>
      <span class="distance">${r.right}</span>
    </div>
  `).join("");

  const isHost = serverState.you === serverState.hostId;
  $("nextRoundBtn").style.display = isHost ? "" : "none";
  $("endRoundBtn").style.display = isHost ? "" : "none";
  $("revealStatus").textContent = isHost ? "" : "ホストの次の操作を待っています";

  const key = result.city.jp + "|" + result.guesses.map(g => g.id + ":" + g.lat.toFixed(3) + "," + g.lng.toFixed(3)).join("|");
  if (key !== lastRevealKey) {
    lastRevealKey = key;
    setTimeout(() => initRevealMap(result, playerById), 60);
  }
}

function formatDistance(km) {
  if (km < 1) return Math.round(km * 1000) + " m";
  if (km < 100) return km.toFixed(1) + " km";
  return Math.round(km).toLocaleString() + " km";
}

function initRevealMap(result, playerById) {
  if (revealMap) { revealMap.remove(); revealMap = null; }
  revealMap = L.map("revealMapEl", {
    worldCopyJump: true,
    zoomControl: true,
  });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    minZoom: 1, maxZoom: 8,
    attribution: "© OpenStreetMap",
  }).addTo(revealMap);

  const bounds = L.latLngBounds([]);
  const answerLL = [result.city.lat, result.city.lng];
  L.marker(answerLL, {
    icon: L.divIcon({
      className: "",
      html: `<div class="answer-marker"></div>`,
      iconSize: [30, 30], iconAnchor: [15, 15],
    }),
    zIndexOffset: 1000,
  }).addTo(revealMap).bindTooltip("📍 " + result.city.jp, { permanent: true, direction: "top", offset: [0, -10] });
  bounds.extend(answerLL);

  result.guesses.forEach(g => {
    const p = playerById.get(g.id);
    if (!p) return;
    const ll = [g.lat, g.lng];
    L.marker(ll, {
      icon: L.divIcon({
        className: "",
        html: `<div class="player-marker" style="background:${p.color}"></div>`,
        iconSize: [22, 22], iconAnchor: [11, 11],
      }),
    }).addTo(revealMap).bindTooltip(p.name, { permanent: false, direction: "top", offset: [0, -8] });
    L.polyline([ll, answerLL], {
      color: p.color, weight: 2, opacity: 0.55, dashArray: "4 6",
    }).addTo(revealMap);
    bounds.extend(ll);
  });

  if (bounds.isValid()) {
    revealMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 5 });
  } else {
    revealMap.setView([20, 0], 1);
  }
  setTimeout(() => revealMap && revealMap.invalidateSize(), 80);
}

function cleanupTimers() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

$("lightbox").addEventListener("click", () => {
  $("lightbox").classList.remove("show");
});

$("enterBtn").addEventListener("click", () => {
  const name = $("nameInput").value.trim();
  let room = $("roomInput").value.trim().toUpperCase();
  if (!name) { showToast("名前を入力してください"); return; }
  if (!room) {
    room = Array.from({length: 5}, () => "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random() * 31)]).join("");
  } else if (!/^[A-Z0-9]{4,6}$/.test(room)) {
    showToast("ルームコードは4〜6文字の英数字");
    return;
  }
  connect(name, room);
});

$("startBtn").addEventListener("click", () => send({ type: "start" }));
$("toGuessBtn").addEventListener("click", () => send({ type: "next" }));
$("nextRoundBtn").addEventListener("click", () => send({ type: "nextRound" }));
$("endRoundBtn").addEventListener("click", () => send({ type: "endRound" }));
$("leaveBtn").addEventListener("click", disconnect);

document.addEventListener("gesturestart", e => e.preventDefault());
</script>
</body>
</html>
